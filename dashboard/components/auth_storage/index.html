<!doctype html><html><head><meta charset="utf-8"></head><body><script>
// Same-origin storage, restricted to SDL auth keys. No third-party scripts.
const keys = ['sdl_auth_refresh_token','sdl_auth_persistence','sdl_auth_persistence_expires_at'];
const send = (type, extra={}) => parent.postMessage({isStreamlitMessage:true,type,...extra}, '*');
addEventListener('message', event => {
  if (event.source !== parent || event.data.type !== 'streamlit:render') return;
  const args = event.data.args || {};
  try {
    for (const [key,value] of Object.entries(args.changes || {})) {
      if (!keys.includes(key)) continue;
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, JSON.stringify(value));
    }
    const values = {};
    for (const key of keys) {
      const raw = localStorage.getItem(key);
      if (raw !== null) { try { values[key] = JSON.parse(raw); } catch { values[key] = raw; } }
    }
    send('streamlit:setComponentValue',{value:{values, operation_id:args.operation_id || '',ok:true}});
  } catch {
    send('streamlit:setComponentValue',{value:{values:{},operation_id:args.operation_id || '',ok:false}});
  }
  send('streamlit:setFrameHeight',{height:0});
});
send('streamlit:componentReady',{apiVersion:1});
send('streamlit:setFrameHeight',{height:0});
</script></body></html>
