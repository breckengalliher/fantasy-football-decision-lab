name: General decision context refresh

on:
  schedule:
    - cron: "0 6,17 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: pip install -r dashboard/requirements.txt pytest
      - name: Require protected provider secret
        shell: bash
        run: test -n "$SPORTSDATAIO_API_KEY"
      - name: Refresh decision context, reporting and roster photos
        run: python src/refresh_live_context.py --include-reporting --include-headshots
      - name: Validate context publication
        run: python -m pytest tests/test_injury_sources.py tests/test_sportsdataio.py tests/test_reporting.py tests/test_headshots.py tests/test_weekly_refresh.py tests/test_player_pool.py -q
      - name: Publish validated context snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/live_refresh_metadata.json data/processed/live_start_sit_board_current.parquet data/processed/live_start_sit_board_4pt_current.parquet data/processed/live_start_sit_board_6pt_current.parquet data/processed/personnel_players_current.parquet data/processed/personnel_teams_current.parquet data/processed/sportsdataio_depth_current.parquet data/processed/reporting_context_current.parquet data/processed/headshot_context_current.parquet data/context_ledger
          git diff --cached --quiet || git commit -m "Refresh general decision context [skip ci]"
          python scripts/prepare_publication.py
          git add -f data/processed/publication_manifest.json
          git diff --cached --quiet || git commit -m "Publish immutable snapshot pointer [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-decision-context
          path: |
            data/processed/live_refresh_metadata.json
            data/processed/live_start_sit_board_4pt_current.parquet
            data/processed/live_start_sit_board_6pt_current.parquet
            data/processed/reporting_context_current.parquet
            data/processed/headshot_context_current.parquet
            data/context_ledger
          if-no-files-found: warn
          retention-days: 14
