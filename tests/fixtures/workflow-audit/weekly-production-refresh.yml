name: Weekly production refresh

on:
  schedule:
    - cron: "0 6 * * 2"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Require protected provider secret
        shell: bash
        run: test -n "$SPORTSDATAIO_API_KEY"
      - name: Build validated 4-point and 6-point snapshots
        run: python src/refresh_weekly_snapshot.py
      - name: Run complete test suite
        run: python -m pytest tests -q
      - name: Reject hard football accounting and projection errors
        run: python scripts/audit_football_logic.py --strict
      - name: Publish validated production snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/live_refresh_metadata.json data/processed/live_weekly_current.parquet data/processed/live_start_sit_board_current.parquet data/processed/live_start_sit_board_4pt_current.parquet data/processed/live_start_sit_board_6pt_current.parquet data/processed/personnel_players_current.parquet data/processed/personnel_teams_current.parquet data/processed/sportsdataio_depth_current.parquet data/processed/reporting_context_current.parquet data/processed/headshot_context_current.parquet data/projection_ledger
          git diff --cached --quiet || git commit -m "Refresh weekly production data [skip ci]"
          python scripts/prepare_publication.py
          git add -f data/processed/publication_manifest.json
          git diff --cached --quiet || git commit -m "Publish immutable snapshot pointer [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-production-snapshots
          path: |
            data/processed/live_refresh_metadata.json
            data/processed/live_weekly_current.parquet
            data/processed/live_start_sit_board_current.parquet
            data/processed/live_start_sit_board_4pt_current.parquet
            data/processed/live_start_sit_board_6pt_current.parquet
            data/processed/reporting_context_current.parquet
            data/processed/headshot_context_current.parquet
            data/projection_ledger
          if-no-files-found: warn
          retention-days: 28
