name: Adaptive player-prop market refresh

on:
  schedule:
    - cron: "*/30 * * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh immediately, ignoring the adaptive interval"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: pip install -r dashboard/requirements.txt pytest
      - name: Require protected provider secret
        shell: bash
        run: test -n "$SPORTSDATAIO_API_KEY"
      - name: Refresh validated market expectations
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python src/refresh_market_snapshot.py --force
          else
            python src/refresh_market_snapshot.py
          fi
      - name: Validate market calculations and publication safeguards
        run: python -m pytest tests/test_market_expectations.py tests/test_sportsdataio.py tests/test_market_refresh.py tests/test_live_dashboard.py -q
      - name: Publish validated market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/live_refresh_metadata.json data/processed/live_start_sit_board_current.parquet data/processed/live_start_sit_board_4pt_current.parquet data/processed/live_start_sit_board_6pt_current.parquet
          git diff --cached --quiet || git commit -m "Refresh player-prop market data [skip ci]"
          git push
