name: Daily production context refresh

on:
  schedule:
    # Two-hour safety net every day. Visitors always read the latest validated
    # snapshot and never call providers directly.
    - cron: "15 */2 * * *"
      timezone: "America/Chicago"
    # Near-live checks during the main NFL windows (Monday, Thursday, Sunday).
    - cron: "*/30 16-23 * * 1,4"
      timezone: "America/Chicago"
    - cron: "*/30 9-23 * * 0"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: pip install -r dashboard/requirements.txt pytest
      - name: Require protected provider secret
        shell: bash
        run: test -n "$SPORTSDATAIO_API_KEY"
      - name: Build complete validated production snapshots
        run: python src/refresh_weekly_snapshot.py
      - name: Run source and refresh tests
        run: python -m pytest tests/test_injury_sources.py tests/test_sportsdataio.py tests/test_reporting.py tests/test_headshots.py tests/test_weekly_refresh.py tests/test_player_pool.py -q
      - name: Publish refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/live_refresh_metadata.json data/processed/live_weekly_current.parquet data/processed/live_start_sit_board_current.parquet data/processed/live_start_sit_board_4pt_current.parquet data/processed/live_start_sit_board_6pt_current.parquet data/processed/personnel_players_current.parquet data/processed/personnel_teams_current.parquet data/processed/sportsdataio_depth_current.parquet data/processed/reporting_context_current.parquet data/processed/headshot_context_current.parquet
          git diff --cached --quiet || git commit -m "Refresh daily production context [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-production-context
          path: |
            data/processed/live_refresh_metadata.json
            data/processed/live_weekly_current.parquet
            data/processed/live_start_sit_board_4pt_current.parquet
            data/processed/live_start_sit_board_6pt_current.parquet
            data/processed/reporting_context_current.parquet
            data/processed/headshot_context_current.parquet
          if-no-files-found: warn
          retention-days: 14
